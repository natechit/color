name = "chromo-contact"
main = "contact-worker.js"
compatibility_date = "2025-01-01"

# Fill these in after deploy / via `wrangler secret put`.
# Secrets (do NOT commit):
#   wrangler secret put RESEND_API_KEY
#
# Public vars:
[vars]
FROM_EMAIL     = "site@hromoepilogi.gr"
TO_EMAIL       = "info@hromoepilogi.gr"
ALLOWED_ORIGIN = "https://www.hromoepilogi.gr"

# Optional: rate-limit KV namespace.
# Create with: wrangler kv namespace create RATE_LIMIT
# Then uncomment and paste the id below.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_KV_ID"
